[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hassan-ai-os"
version = "0.4.1"
description = "Model-agnostic multi-agent control plane: many models think, evidence decides, your machine executes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "segno>=1.5",
  "pillow>=10",
  "arabic-reshaper>=3",
  "python-bidi>=0.4",
  "websockets>=15",
  "psutil>=6.1",
  "pynput>=1.8.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=2"]
gateway = ["litellm[proxy]"]
dev = ["pytest>=8"]

[project.scripts]
hassan-ai = "hassan_ai.server:main"
hassan = "hassan_ai.cli:main"

[tool.setuptools]
packages = ["hassan_ai"]

[tool.setuptools.package-data]
hassan_ai = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
