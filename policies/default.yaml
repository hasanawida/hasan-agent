# Hassan AI OS permission policy.
# Patterns are fnmatch globs on action names. Order of precedence:
# forbidden > approval > auto. Anything not listed requires approval.

auto:
  - project.inspect
  - files.read
  - files.list
  - git.status
  - git.diff
  - git.log
  - checkpoint.create
  - verify.build
  - verify.test
  - openhands.discover
  # Hassan's own local-project MCP server only reads and runs allow-listed checks.
  - mcp.local-project.git_status
  - mcp.local-project.verify
  # Operator mode (PC control): looking is automatic
  - pc.list
  - pc.read
  - pc.search
  - pc.info
  - pc.mkdir
  - pc.open        # documents, folders, URLs (programs/scripts count as pc.launch)
  - pc.web         # read a public web page (private/local addresses are blocked)
  - pc.websearch
  - pc.screenshot  # saved on the PC, shown only to Hassan
  - pc.vscode      # open a folder/file in VS Code
  - pc.apps        # list installed programs
  - pc.video       # build a slide video into Hassan's media folder (new file only)
  # Windows-MCP (control any app): looking at the screen is automatic
  - mcp.windows.State*
  - mcp.windows.Snapshot*
  - mcp.windows.Screenshot*
  - mcp.windows.Wait*
  - mcp.windows.DisplayInventory*

approval:
  - files.write
  - files.patch
  - files.delete
  - git.commit
  - git.reset
  - git.push
  - checkpoint.restore
  - app.launch
  # Operator mode: every change to the PC waits for Hassan
  - pc.write
  - pc.move
  - pc.copy
  - pc.delete      # goes to Hassan's recoverable trash
  - pc.run         # exact command shown before it runs
  - pc.launch
  - pc.camera      # webcam photo
  - pc.mic         # microphone recording
  - pc.blender     # runs a Blender Python script
  - pc.ffmpeg      # video/audio editing command
  - pc.web_query   # web request carrying a long query string (possible data leak)
  - mcp.*.*   # mutating MCP verbs; read-like verbs are auto-classified

forbidden:
  - shell.exec          # no arbitrary shell, ever
  - credentials.read
  - registry.write
  - disk.format
  - system.shutdown
  # Windows-MCP tools that would bypass Hassan's own guarded tools
  - mcp.windows.Registry*
  - mcp.windows.PowerShell*
  - mcp.windows.FileSystem*

# Files agents may never read or write, even inside the workspace.
secret_files:
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "*.pfx"
  - "id_rsa*"
  - "id_ed25519*"
  - "credentials*"
  - "*.kdbx"
  - "secrets.*"
