name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_desktop_touch.cjs tests/test_phone_control.cjs tests/test_screen_mapping.cjs tests/test_screen_ui.cjs tests/test_transfer_panel.cjs
      - run: python -m pip install -e ".[dev]"
      # Outside the checkout: the agent intentionally protects its own source.
      - run: python -m pytest -q --basetemp="${{ runner.temp }}/hassan-tests"
