name: Android companion
on:
  push:
    paths: ['android-companion/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android-companion/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile companion and check Android resources
        working-directory: android-companion
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hassan-phone-apk
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
