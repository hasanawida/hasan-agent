name: Android companion
on:
  push:
    paths: ['android-companion/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android-companion/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile companion and check Android resources
        working-directory: android-companion
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Sign installable update with the project's private key
        if: github.event_name != 'pull_request'
        working-directory: android-companion
        env:
          HASSAN_SIGNING_B64: ${{ secrets.HASSAN_ANDROID_KEYSTORE }}
          HASSAN_SIGNING_PASSWORD: ${{ secrets.HASSAN_ANDROID_PASSWORD }}
        run: |
          test -n "$HASSAN_SIGNING_B64" && test -n "$HASSAN_SIGNING_PASSWORD"
          export HASSAN_SIGNING_FILE="$RUNNER_TEMP/hassan-phone.p12"
          printf '%s' "$HASSAN_SIGNING_B64" | base64 --decode > "$HASSAN_SIGNING_FILE"
          trap 'rm -f "$HASSAN_SIGNING_FILE"' EXIT
          gradle --no-daemon assembleRelease lintRelease
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hassan-phone-apk
          path: android-companion/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
