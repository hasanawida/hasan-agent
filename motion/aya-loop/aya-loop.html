:root {
  --canvas: #ECEAE4;
  --ink: #0D0D0F;
  --paper: #FFFFFF;
  --accent: #F2D263;
  --muted: #6C6D70;
  --line: #E6E3DC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1440px; height: 1440px; overflow: hidden; background: var(--canvas); }
body { font-family: 'Geist', 'PlexArabic', sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
#stage { position: absolute; left: 0; top: 0; width: 1440px; height: 1440px; overflow: hidden; background: var(--canvas); }
#world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
#shape { position: absolute; left: 0; top: 0; overflow: hidden; box-shadow: 0 1px 1px rgba(28, 24, 16, 0.05), 0 12px 32px -12px rgba(28, 24, 16, 0.18); }
.abs { position: absolute; left: 0; top: 0; }
.t { white-space: nowrap; line-height: 1; }
.ar { direction: rtl; font-family: 'PlexArabic', 'Geist', sans-serif; }
.num { font-family: 'Geist', sans-serif; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
svg { display: block; overflow: visible; }
.ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#L_button { width: 330px; height: 88px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 12px; direction: rtl; }
#L_button .lbl { font-size: 27px; font-weight: 500; }
#L_loader, #L_check { width: 108px; height: 108px; }
#L_check { color: var(--ink); }
#L_island { width: 400px; height: 76px; color: #fff; }
#L_card { width: 540px; height: 480px; color: var(--ink); }
#L_age { width: 480px; height: 96px; color: #fff; }
#L_tabs { width: 660px; height: 96px; }
#L_chart { width: 720px; height: 560px; color: var(--ink); }
#L_cmdk { width: 660px; height: 360px; color: var(--ink); }
#L_toast { width: 310px; height: 88px; color: #fff; }

.slide { position: absolute; top: 0; width: 508px; height: 280px; border-radius: 22px; background: #F6F5F1; overflow: hidden; }
.slide img { position: absolute; left: 50%; top: 50%; max-width: 94%; max-height: 97%; transform: translate(-50%, -50%); mix-blend-mode: multiply; }  /* white photo grounds melt into the slide */
.dot { position: absolute; top: 314px; width: 8px; height: 8px; border-radius: 4px; background: #D9D6CF; }
.info { position: absolute; left: 0; top: 0; width: 540px; height: 480px; }
.badge { background: var(--accent); color: var(--ink); height: 30px; padding: 0 12px; border-radius: 15px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

.tabrow { position: absolute; left: 0; top: 0; width: 660px; height: 96px; }
.tab { position: absolute; top: 48px; font-size: 25px; font-weight: 500; transform: translate(-50%, -50%); }
.tabrow.gray .tab { color: #8A867E; }
.tabrow.white .tab { color: #fff; }

#tip { background: var(--ink); color: #fff; height: 40px; border-radius: 20px; }
#tip .tipt { position: absolute; top: 20px; font-size: 18px; font-weight: 500; }

.row { position: absolute; left: 0; width: 660px; height: 64px; }
.row .ico-w { position: absolute; right: 34px; top: 20px; width: 24px; height: 24px; color: #3A3935; }
.row .lbl { position: absolute; right: 72px; top: 32px; font-size: 23px; font-weight: 500; transform: translateY(-50%); }

#cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; transform-origin: 0 0; }
</style>
</head>

  for (const [b, idx] of ev) {

    const top = BASE - HMAX * SKILLS[idx].v / 100;
    TIPX.to(b, BX[idx], first ? INST : FAST); TIPY.to(b, top, first ? INST : FAST); TIPWD.to(b, E.tipW[idx], first ? INST : FAST);
    TIPI.forEach((k, i) => k.to(i === idx && !first ? b + 0.1 : b, i === idx ? 1 : 0, i === idx ? (first ? INST : ENTER) : EXIT));
    first = false;
  }
  TIPI.forEach((k) => k.to(23.5, 0, INST));
  E.hoverEvents = ev;
}
/* which product the card shows follows the carousel's rounded index (derived once, then springs) */
function buildItems() {
  ITEMP = ITEMS.map(() => tr(ENTER));
  let prev = 0;
  ITEMP[0].to(5 + D + 0.1, 1); ITEMP.forEach((k, i) => i && k.to(5, 0, INST));
  for (let t = G1; t <= 10 * B; t += 0.002) {
    const idx = clamp(Math.round(offsetAt(t) / PITCH), 0, 2);
    if (idx !== prev) {
      ITEMP[prev].to(t / B, 0, EXIT); ITEMP[idx].to(t / B + 0.1, 1, ENTER); prev = idx;
    }
  }
  ITEMP[prev].to(10, 0, EXIT);
}

/* seek(t): every style from time */
const wrapT = (t) => ((t % T) + T) % T;
function fx(el, p, o) {
  o = o || {};
  const q = clamp(p, 0, 1);
  el.style.visibility = q < 0.002 ? 'hidden' : 'visible';
  el.style.opacity = q >= 0.999 ? '' : q.toFixed(4);
  const blur = (1 - q) * (o.blur == null ? 10 : o.blur);
  el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
  const dy = (1 - q) * (o.dy == null ? 6 : o.dy), sc = 1 - (1 - q) * (o.sc == null ? 0.04 : o.sc);
  return (o.base || '') + ` translate(0px, ${dy.toFixed(3)}px) scale(${sc.toFixed(4)})`;
}
const softmin = (a, b) => { const p = 8; return a * b / Math.pow(Math.pow(a, p) + Math.pow(b, p), 1 / p); };

function seek(tIn) {
  const t = wrapT(tIn), beat = t / B;
  const stretch = stretchAt(t);
  const w = SH.w.at(t) + stretch, h = SH.h.at(t) - stretch * 0.09;
  const cx = SH.cx.at(t) - stretch / 2, cy = SH.cy.at(t);

  /* camera: springs toward each state's zoom, and never lets the live shape leave the frame */
  const zFit = 0.9 * 1440 / Math.max(w, h);
  const z = softmin(Math.exp(CAMZ.at(t)), zFit);
  const camX = CAMX.at(t) - stretch / 2, camY = CAMY.at(t);
  E.world.style.transform = `translate(720px, 720px) scale(${z.toFixed(5)}) translate(${(-camX).toFixed(3)}px, ${(-camY).toFixed(3)}px)`;

  const r = Math.min(SH.r.at(t), w / 2, h / 2);
  const L = cx - w / 2, Tp = cy - h / 2, cx0 = SH.cx.at(t);
  const press = SHP.at(t);
  const sh = E.shape.style;
  sh.left = `${L.toFixed(3)}px`; sh.top = `${Tp.toFixed(3)}px`;
  sh.width = `${w.toFixed(3)}px`; sh.height = `${h.toFixed(3)}px`;
  sh.borderRadius = `${r.toFixed(3)}px`;
  sh.background = SH.bg.at(t);
  sh.transform = press > 0.0005 ? `scale(${(1 - 0.045 * press).toFixed(5)})` : '';
  const toLocal = (x, y) => [x - L, y - Tp];
  function place(el, bw, bh, p, pinTop, opts) {
    const lx = (cx0 - bw / 2) - L, ly = pinTop ? 0 : h / 2 - bh / 2;
    el.style.left = `${lx.toFixed(3)}px`; el.style.top = `${ly.toFixed(3)}px`;
    el.style.transform = fx(el, p, opts);
    return [lx, ly];
  }

  /* bar */
  const v = valueAt(t);
  {
    const trkP = TRKP.at(t);
    const xr = TXR.at(t), len = TLEN.at(t) + stretch, th = TTH.at(t);
    const [lx, ly] = toLocal(xr - len, -th / 2);
    const s = E.trk.style;
    s.left = `${lx.toFixed(3)}px`; s.top = `${ly.toFixed(3)}px`;
    s.width = `${len.toFixed(3)}px`; s.height = `${th.toFixed(3)}px`; s.borderRadius = `${(th / 2).toFixed(3)}px`;
    s.background = TBG.at(t);
    s.opacity = clamp(trkP, 0, 1).toFixed(4); s.visibility = trkP < 0.002 ? 'hidden' : 'visible';
    const f = E.trkFill.style;
    f.left = `${(len * (1 - v)).toFixed(3)}px`; f.width = `${(len * v).toFixed(3)}px`;
    f.height = `${th.toFixed(3)}px`; f.borderRadius = `${(th / 2).toFixed(3)}px`; f.background = TFG.at(t);
  }
  /* carousel dots (static) */
  {
    const p = LP.card.at(t);
    const [lx, ly] = toLocal(0, 0);
    E.dots.style.left = `${lx.toFixed(3)}px`; E.dots.style.top = `${ly.toFixed(3)}px`;
    E.dotEls.forEach((d, i) => { d.style.left = `${(16 - 20 * i).toFixed(1)}px`; d.style.top = `${(DOTY - 4).toFixed(1)}px`; });
    E.dots.style.opacity = clamp(p, 0, 1).toFixed(4);
    E.dots.style.visibility = p < 0.002 ? 'hidden' : 'visible';
  }
  /* pill */
  {
    let x0, x1, y0, y1;
    if (t >= ATTACH0 && t < ATTACH1) [x0, x1, y0, y1] = attachedRect(t);
    else { x0 = PX0.at(t); x1 = PX1.at(t); y0 = PY0.at(t); y1 = PY1.at(t); }
    const pw = Math.max(0, x1 - x0), ph = Math.max(0, y1 - y0);
    const [lx, ly] = toLocal(x0, y0);
    const pp = PILLP.at(t), s = E.pill.style;
    s.left = `${lx.toFixed(3)}px`; s.top = `${ly.toFixed(3)}px`;
    s.width = `${pw.toFixed(3)}px`; s.height = `${ph.toFixed(3)}px`;
    s.borderRadius = `${Math.min(PR.at(t), pw / 2, ph / 2).toFixed(3)}px`;
    s.background = PCOL.at(t);
    s.opacity = clamp(pp, 0, 1).toFixed(4); s.visibility = pp < 0.002 ? 'hidden' : 'visible';
    E.pillRect = [x0, x1, y0, y1];
  }
  /* the child's age rides inside the knob: 3 … 8, then 8+ while pulled past the end */
  {
    const [x0, x1, y0, y1] = E.pillRect;
    const [lx, ly] = toLocal((x0 + x1) / 2, (y0 + y1) / 2);
    const raw = t >= G2 && t <= R2 ? rawAge(t) : (t > R2 ? 1 : V0);
    E.knobNum.textContent = raw > 1.0005 ? '8+' : String(Math.round(3 + 5 * clamp(raw, 0, 1)));
    E.knobNum.style.left = `${lx.toFixed(3)}px`; E.knobNum.style.top = `${ly.toFixed(3)}px`;
    E.knobNum.style.transform = fx(E.knobNum, KNUM.at(t), { base: 'translate(-50%, -50%)', dy: 0, sc: 0.3, blur: 4 });
  }

  place(E.L_button, 330, 88, LP.button.at(t));
  {
    place(E.L_loader, 108, 108, LP.loader.at(t), false, { dy: 0, sc: 0.2 });
    const circ = 2 * Math.PI * 24, a = clamp(RING.at(t), 0, 1);
    $('ring').style.strokeDasharray = `${(circ * a).toFixed(3)} ${circ.toFixed(3)}`;
    $('ring').style.strokeOpacity = a > 0.004 ? '1' : '0';
    $('ring').setAttribute('transform', `rotate(${(-90 + t * 400).toFixed(3)} 54 54)`);
  }
  {
    place(E.L_check, 108, 108, LP.check.at(t), false, { dy: 0, sc: 0.1 });
    const k = clamp(CHECK.at(t), 0, 1);
    E.checkPath.style.strokeDasharray = `${E.checkLen} ${E.checkLen}`;
    E.checkPath.style.strokeDashoffset = `${(E.checkLen * (1 - k)).toFixed(3)}`;
    E.checkPath.style.strokeOpacity = k > 0.004 ? '1' : '0';
  }
  place(E.L_island, 400, 76, LP.island.at(t), false, { blur: 6 });
  /* card */
  {
    const p = LP.card.at(t);
    place(E.L_card, 540, 480, p, false, { dy: 0, sc: 0.02, blur: 8 });
    E.L_card.style.filter = 'none'; E.L_card.style.opacity = p < 0.002 ? '0' : '';
    E.cc.forEach((el) => { el.style.transform = fx(el, Math.min(p, CSTAG[+el.dataset.st].at(t)), { dy: 10, blur: 8 }); });
    E.strip.style.transform = `translateX(${offsetAt(t).toFixed(3)}px)`;
    E.itemEls.forEach((g, i) => { g.style.transform = fx(g, Math.min(p, ITEMP[i].at(t)), { dy: 8, blur: 8, sc: 0.01 }); });
    E.plusBtn.style.transform = `scale(${(1 - 0.1 * PLUSPR.at(t)).toFixed(4)})`;
    E.ageChip.style.background = CHIPPR.at(t) > 0.02 ? `rgba(13,13,15,${(0.07 * CHIPPR.at(t)).toFixed(4)})` : 'transparent';
    const q1 = clamp(Q1.at(t), 0, 1), q2 = clamp(Q2.at(t), 0, 1);
    E.qty1.style.transform = fx(E.qty1, q1, { base: 'translate(-50%, -50%)', dy: -14, blur: 6, sc: 0.2 });
    E.qty2.style.transform = fx(E.qty2, q2, { base: 'translate(-50%, -50%)', dy: 14, blur: 6, sc: 0.2 });
  }
  place(E.L_age, 480, 96, LP.age.at(t));
  E.okBtn.style.transform = `scale(${(1 - 0.12 * OKPR.at(t)).toFixed(4)})`;
  /* tabs */
  {
    const [lx, ly] = place(E.L_tabs, 660, 96, LP.tabs.at(t), true, { dy: 0, sc: 0.02 });
    const [x0, x1, y0, y1] = E.pillRect;
    const bx = L + lx, by = Tp + ly;
    const cl = x0 - bx, cr = 660 - (x1 - bx), ct = y0 - by, cb = 96 - (y1 - by);
    const rr = Math.min(PR.at(t), (x1 - x0) / 2, (y1 - y0) / 2);
    E.tabsWhite.style.clipPath = `inset(${ct.toFixed(2)}px ${cr.toFixed(2)}px ${cb.toFixed(2)}px ${cl.toFixed(2)}px round ${rr.toFixed(2)}px)`;
  }
  /* chart */
  {
    const p = LP.chart.at(t);
    place(E.L_chart, 720, 560, p, false, { dy: 0, sc: 0, blur: 8 });
    E.ch.forEach((el, i) => { el.style.transform = fx(el, Math.min(p, clamp(p * 1.15 - i * 0.12, 0, 1)), { base: 'translateY(-50%)', dy: 8 }); });
    const hp = clamp(TIPP.at(t), 0, 1);
    E.barEls.forEach((rect, i) => {
      const k = Math.max(0, DRAW[i].at(t));
      const hh = HMAX * SKILLS[i].v / 100 * k;
      rect.setAttribute('y', (BASE - hh).toFixed(3)); rect.setAttribute('height', Math.max(0, hh).toFixed(3));
      const hov = clamp(TIPI[i].at(t), 0, 1) * hp;
      rect.setAttribute('fill', hov > 0.5 ? ACC : INK);
      rect.style.opacity = hh > 0.5 ? '1' : '0';
    });
    E.labelEls.forEach((el, i) => { el.style.transform = fx(el, Math.min(p, clamp(DRAW[i].at(t) * 1.4, 0, 1)), { base: 'translate(-50%, -50%)', dy: 6 }); });
    const tx = TIPX.at(t), ty = TIPY.at(t);
    const tw = TIPWD.at(t);
    E.tip.style.width = `${Math.max(40, tw).toFixed(3)}px`;
    E.tip.style.left = `${tx.toFixed(3)}px`; E.tip.style.top = `${(ty - 14).toFixed(3)}px`;
    E.tip.style.transform = fx(E.tip, Math.min(hp, p), { base: 'translate(-50%, -100%)', dy: 6, sc: 0.1, blur: 6 });
    E.tipTexts.forEach((s, i) => {
      s.style.left = `${(Math.max(40, tw) / 2).toFixed(3)}px`;
      s.style.transform = fx(s, TIPI[i].at(t), { base: 'translate(-50%, -50%)', dy: 5, blur: 6 });
    });
  }
  /* search */
  {
    const p = LP.cmdk.at(t);
    place(E.L_cmdk, 660, 360, p, true, { dy: 0, sc: 0.02 });
    E.rowEls.forEach((el, i) => {
      el.style.top = `${(93 + 64 * RSLOT[i].at(t)).toFixed(3)}px`;
      el.style.transform = fx(el, RP[i].at(t), { dy: 10, blur: 10 });
    });
    // Arabic joins, so the query is one string per keystroke; the new letter is revealed from the right edge
    const a = clamp(QA.at(t), 0, 1), b2 = clamp(QB.at(t), 0, 1), rv = clamp(REVEAL.at(t), 0, 1);
    const showB = b2 > 0.5;
    const wPrev = showB ? E.qW[0] : 0, wCur = showB ? E.qW[1] : E.qW[0];
    const visW = wPrev + (wCur - wPrev) * rv;
    const el = showB ? E.qB : E.qA, other = showB ? E.qA : E.qB;
    other.style.visibility = 'hidden';
    el.style.visibility = (showB ? b2 : a) > 0.002 ? 'visible' : 'hidden';
    el.style.opacity = '';
    el.style.clipPath = `inset(-10px 0px -10px ${(wCur - visW).toFixed(2)}px)`;
    el.style.transform = 'translateY(-50%)';
    const typing = beat >= 23.9 && beat < 25.2;
    const blinkOn = Math.floor(beat * 2) % 2 === 0;
    E.caret.style.left = `${(660 - 70 - visW - 4).toFixed(3)}px`;
    E.caret.style.opacity = (typing || blinkOn) ? '1' : '0';
    E.placeholder.style.transform = fx(E.placeholder, PLACE.at(t), { base: 'translateY(-50%)', dy: 0, sc: 0.02 });
    const kp = KEYPR.at(t);
    E.keycap.style.transform = `scale(${(1 - 0.1 * kp).toFixed(4)})`;
    E.keycap.style.background = kp > 0.02 ? `rgba(13,13,15,${(0.08 * kp).toFixed(4)})` : 'transparent';
  }
  {
    place(E.L_toast, 310, 88, LP.toast.at(t));
    const k = clamp(TOASTCHK.at(t), 0, 1);
    E.toastCheck.style.strokeDasharray = `${E.toastLen} ${E.toastLen}`;
    E.toastCheck.style.strokeDashoffset = `${(E.toastLen * (1 - k)).toFixed(3)}`;
    E.toastCheck.style.strokeOpacity = k > 0.004 ? '1' : '0';
  }
  {
    const x = CX.at(t), y = CY.at(t), pr = CPR.at(t);
    const sx = 720 + (x - camX) * z, sy = 720 + (y - camY) * z;
    E.cursor.style.transform = `translate(${(sx - 3).toFixed(3)}px, ${(sy - 2.2).toFixed(3)}px) scale(${(1 - 0.12 * pr).toFixed(4)})`;
  }
  return t;
}

function init() {
  setupDom();
  ALL.forEach((k) => k.build());
  // carousel release: where the strip was, how fast, and which photo it snaps to
  const rawO = (tt) => { const d = CX.at(tt) - CX.at(G1); return d < 0 ? -rubber(-d) : d; };
  O_REL = rawO(R1); OV_REL = (rawO(R1) - rawO(R1 - 1e-3)) / 1e-3;
  O_SNAP = PITCH * clamp(Math.round(O_REL / PITCH + 0.25 + OV_REL / PITCH * 0.15), 0, 2);
  const rs = (tt) => rubber(Math.max(0, (rawAge(tt) - 1) * 285));
  ST_REL = rs(R2); SV_REL = (rs(R2) - rs(R2 - 1e-3)) / 1e-3;
  buildItems();
  buildPill();
  buildHover();
  ALL.forEach((k) => k.build());
  seek(0);
}

function exportCues() {
  const samp = (a, b, fn, dt) => { const o = []; for (let t = a; t <= b + 1e-9; t += dt) o.push([+t.toFixed(4), +fn(t).toFixed(5)]); return o; };
  return {
    B, T, BEATS,
    carousel: samp(G1 - 0.05, 10 * B, offsetAt, 0.001), pitch: PITCH,
    value: samp(G2 - 0.05, R2 + 0.05, valueAt, 0.001),
    stretch: samp(G2, R2 + 0.6, stretchAt, 0.001),
    hover: E.hoverEvents.filter((e) => e[1] >= 0).map((e) => [e[0] * B, e[1]]),
    grab: [G1, G2], release: [R1, R2],
  };
}
window.CUES = exportCues;
window.CFG = CFG;
window.TIMING = { B, T, BEATS };
window.seek = seek;
window.__ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load('500 27px PlexArabic', 'أضف'), document.fonts.load('600 25px PlexArabic', 'عالم'),
  document.fonts.load('400 24px PlexArabic', 'ابحث'), document.fonts.load('500 25px Geist', 'K'),
  document.fonts.load('600 28px Geist', '260'),
  ...[...document.images].map((im) => im.decode().catch(() => null)),
])).then(() => { init(); window.DEBUG = { hover: E.hoverEvents, O_REL, OV_REL, O_SNAP, ST_REL }; return true; });
const q = new URLSearchParams(location.search);
if (q.has('t')) window.__ready.then(() => seek(parseFloat(q.get('t'))));
})();
